name: Build and Release Unified Contacts
run-name: Build and Release Unified Contacts

# Mapping:
#   Push to main                -> Creates tag and prerelease including binaries - Set to release manually.
#   Dispatch on main            -> Skip execution completely.
#   Dispatch on other branches  -> Creates a binary build only.

concurrency:
  group: "Create Unified Contacts Release"
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '26.x'
  CONFIGURATION: Release
  WORKING_DIRECTORY: UnifiedContacts/UnifiedContacts.Server
  CI: false

jobs:
  generate_version:
    name: Generate version and draft release
    # Manual dispatches on main branch will be skipped to avoid creating a release for the same commit twice
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates the version tag and the draft release
    outputs:
      tag: ${{ steps.generate_version.outputs.tag }}
      release_id: ${{ steps.generate_version.outputs.release_id }}
    steps:
      - name: Generate version and draft release
        id: generate_version
        uses: glueckkanja/action-epoch-semantic-version@f1eb38a96b44a2a9ce4378257afceed2babcc6e1 # v2.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          is_prerelease: true
          is_draft_release: true
          suppress_release: ${{ !(github.event_name == 'push' && github.ref_name == 'main') }}

  build:
    name: Build Unified Contacts
    runs-on: ubuntu-latest
    needs:
      - generate_version
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      # zizmor: ignore[cache-poisoning] - workflow runs only on main push / workflow_dispatch (never on PRs) and npm caching is disabled
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Create lib directory for NuGet local source
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ env.WORKING_DIRECTORY }}/lib"
        Write-Host "Created lib directory for NuGet local source"
        
    - name: Restore .NET dependencies
      shell: pwsh
      run: |
        # Create a custom NuGet.Config that only uses nuget.org
        $nugetConfig = @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
          </packageSources>
        </configuration>
        "@
        
        # Save to a temp file
        $nugetConfig | Out-File -FilePath "./nuget.config" -Encoding UTF8
        
        # Use the custom config for restore
        dotnet restore "${{ env.WORKING_DIRECTORY }}" --configfile "./nuget.config"

    - name: Stamp version into server and client
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.generate_version.outputs.tag }}
      run: |
        $version = "$env:RELEASE_VERSION"
        foreach ($file in @("UnifiedContacts/UnifiedContacts.Server/Settings/StaticSettings.cs", "UnifiedContacts/unifiedcontacts.client/src/StaticSettings.ts")) {
          (Get-Content $file -Raw) -replace '/INTERNAL_BUILD/', $version | Set-Content $file -Encoding UTF8
          Write-Host "Stamped version $version into $file"
        }

    - name: Install Node.js dependencies
      shell: pwsh
      run: |
        cd UnifiedContacts/unifiedcontacts.client
        npm ci

    - name: Build React client
      shell: pwsh
      run: |
        cd UnifiedContacts/unifiedcontacts.client
        npm run build

    - name: Build .NET application
      shell: pwsh
      run: |
        dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Test .NET application
      shell: pwsh
      run: |
        dotnet test "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    - name: Publish .NET application
      shell: pwsh
      run: |
        dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output ./publish

    - name: Create PowerShell module structure
      shell: pwsh
      run: |
        # Create module directory structure
        New-Item -ItemType Directory -Force -Path "./publish-module/UnifiedContactsPS"
        
        # Copy PowerShell module files
        Copy-Item -Path "UnifiedContactsPS/*" -Destination "./publish-module/UnifiedContactsPS/" -Recurse -Force
        
        # Copy ARM templates
        New-Item -ItemType Directory -Force -Path "./publish-module/arm-templates"
        Copy-Item -Path "arm-templates/*" -Destination "./publish-module/arm-templates/" -Recurse -Force

    - name: Create binaries package
      env:
        RELEASE_VERSION: ${{ needs.generate_version.outputs.tag }}
        COMMIT_SHA: ${{ github.sha }}
      shell: pwsh
      run: |
        # Create binaries directory
        New-Item -ItemType Directory -Force -Path "./binaries"
        New-Item -ItemType Directory -Force -Path "./release_assets"
        
        # Copy published application
        Copy-Item -Path "./publish/*" -Destination "./binaries/" -Recurse -Force
        
        # Create version info file
        $versionInfo = @{
          version = "$env:RELEASE_VERSION"
          buildDate = (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          commit = "$env:COMMIT_SHA"
        }
        $versionInfo | ConvertTo-Json | Out-File -FilePath "./binaries/version.json" -Encoding UTF8
        
        # Create zip file
        Compress-Archive -Path "./binaries/*" -DestinationPath "./release_assets/binaries.zip" -Force

    - name: Create PowerShell module package
      shell: pwsh
      run: |
        Compress-Archive -Path "./publish-module/*" -DestinationPath "./release_assets/UnifiedContactsPS.zip" -Force

    - name: Create Release
      uses: glueckkanja/action-attach-assets-to-release@bbabe998fafc70062e3b85dcb39867ffba1402b8 # v0.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        release_id: ${{ needs.generate_version.outputs.release_id }}
        asset_path: "release_assets"
        publish_draft_release: "true" # -> condition

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unified-contacts-${{ needs.generate_version.outputs.tag }}
        path: |
          ./release_assets/binaries.zip
          ./release_assets/UnifiedContactsPS.zip
          ./publish/
        retention-days: 30


